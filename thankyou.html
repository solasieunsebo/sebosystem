<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 완료 | SEBO SYSTEM</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard';
      font-weight: 400;
      background-color: #f8fafc;
      color: #1a1a1a;
    }

    .thankyou-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 60px 20px;
    }

    .thankyou-container h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #0057a8;
    }

    .thankyou-container p {
      font-weight: 400;
      font-family: 'Pretendard';
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .thankyou-container .btn {
      padding: 12px 28px;
      font-weight: 400;
      font-family: 'Pretendard';
      font-size: 1.2rem;
      background-color: #0057a8;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .thankyou-container .btn:hover {
      background-color: #2ecc71;
      transform: scale(1.1);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="thankyou-container">
    <div class="emoji">🎉</div>
    <h1>문의가 성공적으로 접수되었습니다!</h1>
    <p>
      담당자가 빠르게 확인 후 연락드릴 예정입니다.<br>
      이용해주셔서 감사합니다.
    </p>
    <a href="index.html" class="btn">홈으로 돌아가기</a>
    <!-- 햄버거 버튼 -->
    <button class="hamburger" aria-label="메뉴 열기" id="hamburgerBtn">☰</button>
  </div>
<script src="js/main.js"></script>
</body>
</html>
